<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration — Test Prep</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="brand-header">
      <img class="brand-logo" src="logo.jpg" alt="KP learning center logo" />
      <div>
        <p class="eyebrow">KP Learning Center</p>
        <h1>Student Registration</h1>
      </div>
    </header>
    <p class="subtitle">Start your path to exam success. Tell us a little about yourself and choose the test tracks you want to prepare for.</p>

    <p id="form-error" class="error" hidden></p>

    <form action="/register" method="post" enctype="multipart/form-data">
      <div class="form-grid">
        <div class="field">
          <label for="full_name">Full name</label>
          <input type="text" id="full_name" name="full_name" maxlength="150" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" maxlength="150" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <input type="tel" id="phone" name="phone" maxlength="30" autocomplete="tel" required />
        </div>

        <div class="field">
          <label for="school">School / Institution <span class="optional">(optional)</span></label>
          <input type="text" id="school" name="school" maxlength="150" autocomplete="organization" />
        </div>
      </div>

      <div class="field">
        <label for="transcript">Upload transcript <span class="optional">PDF, JPG or PNG · max 5 MB</span></label>
        <input type="file" id="transcript" name="transcript" accept=".pdf,.jpg,.jpeg,.png" required />
      </div>

      <fieldset>
        <legend>Choose one or more tracks</legend>
        <p class="fieldset-help">Select every exam you’d like to prepare for.</p>
        <label class="check"><input type="checkbox" name="tracks" value="TOEFL" /> TOEFL</label>
        <label class="check"><input type="checkbox" name="tracks" value="IELTS" /> IELTS</label>
        <label class="check"><input type="checkbox" name="tracks" value="SAT" /> SAT</label>
        <label class="check"><input type="checkbox" name="tracks" value="Duolingo" /> Duolingo</label>
      </fieldset>

      <button type="submit"><span>Complete registration</span><span aria-hidden="true">→</span></button>
    </form>
  </main>

  <script src="index.js"></script>
</body>
</html>
